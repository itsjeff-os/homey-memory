input_boolean:
  guest_mode:
    name: Guest Mode
    icon: mdi:account-group
    initial: false
  sleep_mode:
    name: Sleep Mode
    icon: mdi:sleep
    initial: false
  adaptive_lighting_pause:
    name: Adaptive Lighting Pause
    icon: mdi:pause-circle-outline
    initial: false

input_number:
  default_on_brightness_pct:
    name: Default On Brightness
    icon: mdi:brightness-6
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    initial: 55
  default_on_kelvin:
    name: Default On Kelvin
    icon: mdi:temperature-kelvin
    min: 2000
    max: 6500
    step: 50
    unit_of_measurement: K
    initial: 2900
  night_brightness_cap:
    name: Night Brightness Cap
    icon: mdi:weather-night
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    initial: 22
  default_fade_in_seconds:
    name: Default Fade In Seconds
    icon: mdi:transfer-up
    min: 0
    max: 30
    step: 0.1
    unit_of_measurement: s
    initial: 2.2
  default_fade_out_seconds:
    name: Default Fade Out Seconds
    icon: mdi:transfer-down
    min: 0
    max: 30
    step: 0.1
    unit_of_measurement: s
    initial: 5.5

input_select:
  orchestration_mode:
    name: Orchestration Mode
    icon: mdi:timeline-outline
    options:
      - auto
      - uniform
      - task_then_ambient
      - ambient_then_task
      - staged
    initial: auto

script:
  lighting_defaults_room_on:
    alias: Lighting Defaults - Room On
    mode: restart
    fields:
      room:
        description: Logical room key
        example: core
    variables:
      room_key: "{{ room | default('') }}"
      brightness_pct: "{{ states('input_number.default_on_brightness_pct') | int(55) }}"
      kelvin: "{{ states('input_number.default_on_kelvin') | int(2900) }}"
      fade_in: "{{ states('input_number.default_fade_in_seconds') | float(2.2) }}"
      orchestration: "{{ states('input_select.orchestration_mode') }}"
    sequence:
      - choose:
          - conditions: "{{ room_key == 'core' and orchestration in ['auto', 'task_then_ambient'] }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.core_ceiling
                data:
                  brightness_pct: "{{ brightness_pct }}"
                  kelvin: "{{ kelvin }}"
                  transition: "{{ fade_in }}"
              - delay:
                  milliseconds: 800
              - service: light.turn_on
                target:
                  entity_id: light.core_ambient
                data:
                  brightness_pct: "{{ [brightness_pct - 15, 10] | max }}"
                  kelvin: "{{ kelvin }}"
                  transition: "{{ fade_in }}"
          - conditions: "{{ room_key == 'core' and orchestration == 'ambient_then_task' }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.core_ambient
                data:
                  brightness_pct: "{{ [brightness_pct - 15, 10] | max }}"
                  kelvin: "{{ kelvin }}"
                  transition: "{{ fade_in }}"
              - delay:
                  milliseconds: 800
              - service: light.turn_on
                target:
                  entity_id: light.core_ceiling
                data:
                  brightness_pct: "{{ brightness_pct }}"
                  kelvin: "{{ kelvin }}"
                  transition: "{{ fade_in }}"
          - conditions: "{{ room_key == 'core' and orchestration == 'staged' }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.core_path
                data:
                  brightness_pct: "{{ [brightness_pct - 25, 8] | max }}"
                  kelvin: "{{ kelvin }}"
                  transition: "{{ fade_in }}"
              - delay:
                  milliseconds: 500
              - service: light.turn_on
