          room: core
      - service: script.lighting_defaults_room_off
        data:
          room: kitchen
      - service: script.lighting_defaults_room_off
        data:
          room: alpha
      - service: script.lighting_defaults_room_off
        data:
          room: beta
      - service: script.lighting_defaults_room_off
        data:
          room: pass
      - service: script.lighting_defaults_room_off
        data:
          room: splash
      - service: script.lighting_defaults_room_off
        data:
          room: throne
      - service: script.lighting_defaults_room_off
        data:
          room: chaos

automation:
  - id: lighting_defaults_apply_on_room_activation
    alias: Lighting Defaults - Apply On Room Activation
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - light.core_open_plan
          - light.core_kitchen
          - light.alpha_bedroom
          - light.beta_bedroom
          - light.pass_hallway
          - light.splash_bathroom
          - light.throne_bathroom
          - light.chaos_laundry
        from: "off"
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.adaptive_lighting_pause
        state: "off"
    action:
      - variables:
          room_key: >-
            {% set mapping = {
              'light.core_open_plan': 'core',
              'light.core_kitchen': 'kitchen',
              'light.alpha_bedroom': 'alpha',
              'light.beta_bedroom': 'beta',
              'light.pass_hallway': 'pass',
              'light.splash_bathroom': 'splash',
              'light.throne_bathroom': 'throne',
              'light.chaos_laundry': 'chaos'
            } %}
            {{ mapping.get(trigger.entity_id, '') }}
      - service: script.lighting_defaults_room_on
        data:
          room: "{{ room_key }}"
