  lighting_defaults_room_off:
    alias: Lighting Defaults - Room Off
    mode: restart
    fields:
      room:
        description: Logical room key
        example: core
    variables:
      room_key: "{{ room | default('') }}"
      fade_out: "{{ states('input_number.default_fade_out_seconds') | float(5.5) }}"
      orchestration: "{{ states('input_select.orchestration_mode') }}"
    sequence:
      - choose:
          - conditions: "{{ room_key == 'core' and orchestration in ['auto', 'task_then_ambient', 'uniform'] }}"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.core_open_plan
                data:
                  transition: "{{ fade_out }}"
          - conditions: "{{ room_key == 'core' and orchestration == 'ambient_then_task' }}"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.core_ambient
                data:
                  transition: "{{ fade_out }}"
              - delay:
