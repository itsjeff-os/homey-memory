blueprint:
  name: Room Presence Lighting (Context-Aligned)
  description: >
    FP2/occupancy-driven lighting that respects Home Context 2.0 states
    and delegates colour/brightness to Adaptive Lighting.
  domain: automation

  input:
    presence_entity:
      name: Presence entity (FP2/FP1E)
      selector: { entity: { domain: binary_sensor } }

    light_target:
      name: Light group/entity for this room
      selector: { target: { entity: { domain: light } } }

    adaptive_switch:
      name: Adaptive Lighting switch for this room
      selector: { entity: { domain: switch } }

    home_context:
      name: Home Context sensor
      default: sensor.home_context
      selector: { entity: { domain: sensor } }

    off_delay:
      name: Off delay when room empty (minutes)
      default: 5
      selector: { number: { min: 0, max: 60, step: 1 } }

    night_min_pct:
      name: Night minimum brightness (%)
      default: 5
      selector: { number: { min: 1, max: 30, step: 1 } }

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input presence_entity

variables:
  presence_entity: !input presence_entity
  light_target: !input light_target
  adaptive_switch: !input adaptive_switch
  home_context: !input home_context
  off_delay: !input off_delay
  night_min_pct: !input night_min_pct

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input presence_entity
            state: "on"
          - condition: state
            entity_id: !input home_context
            state: "normal"
        sequence:
          - service: switch.turn_on
            target: { entity_id: !input adaptive_switch }
          - service: adaptive_lighting.apply
            target: { entity_id: !input adaptive_switch }
            data:
              lights: !input light_target

      - conditions:
          - condition: state
            entity_id: !input presence_entity
            state: "on"
          - condition: state
            entity_id: !input home_context
            state: "sleep"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input night_min_pct
              transition: 1.5

      - conditions:
          - condition: state
            entity_id: !input presence_entity
            state: "on"
          - condition: state
            entity_id: !input home_context
            state: "override"
        sequence:
          - service: light.turn_on
            target: !input light_target

      - conditions:
          - condition: state
            entity_id: !input presence_entity
            state: "off"
        sequence:
          - delay: "00:{{ '%02d'|format((!input off_delay)|int) }}:00"
          - condition: state
            entity_id: !input presence_entity
            state: "off"
          - service: light.turn_off
            target: !input light_target
            data: { transition: 1.5 }
