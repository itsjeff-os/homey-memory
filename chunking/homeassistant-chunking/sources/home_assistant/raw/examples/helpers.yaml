sensor:
  - platform: systemmonitor
    resources:
      - type: memory_use_percent
      - type: processor_use
      - type: disk_use_percent
      - type: last_boot

  - platform: file
    name: HA Database Size
    file_path: /config/home-assistant_v2.db
    value_template: "{{ (value | float(0) / 1048576) | round(1) }}"
    unit_of_measurement: "MB"

input_boolean:
  override_mode:
    name: Override Mode
    icon: mdi:tune-variant

  sleep_mode:
    name: Sleep Mode
    icon: mdi:sleep

  away_mode:
    name: Away Mode
    icon: mdi:exit-run

  guest_mode:
    name: Guest Mode
    icon: mdi:account-heart

  focus_mode:
    name: Focus Mode
    icon: mdi:target-variant

  recovery_mode:
    name: Recovery Mode
    icon: mdi:heart-pulse

  hydration_nags_enabled:
    name: Hydration Nags Enabled
    icon: mdi:cup-water

input_select:
  energy_state:
    name: Energy State
    options:
      - enter
      - active
      - focus
      - ease
      - rest
    icon: mdi:pulse

input_number:
  motion_timeout_default:
    name: Motion Timeout Default
    min: 0
    max: 60
    step: 1
    unit_of_measurement: minutes
    icon: mdi:timer

binary_sensor:
  quiet_hours:
    name: Quiet Hours
    device_class: running
  anyone_home:
    name: Anyone Home
    device_class: occupancy
  is_daylight:
    name: Is Daylight
    device_class: light
