name: README inventory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install intake test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test inventory generation
        run: python3 -m unittest discover -s tests -v
      - name: Check generated inventories
        run: python3 scripts/generate_readmes.py --check
